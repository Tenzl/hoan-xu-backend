# Install as /etc/ssh/sshd_config.d/60-chrome-tunnel.conf, then run sshd -t.
# Keep a separate administrator account for maintenance.
Match User chrome-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AllowTcpForwarding local
    AllowStreamLocalForwarding no
    PermitOpen 127.0.0.1:9222 127.0.0.1:6080
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitTunnel no
    MaxSessions 0
Match all
