      }
    },
    "schemas": {
      "User": {
        "type": "object",
        "required": [
          "id",
          "name",
          "email",
          "role",
          "blocked",
          "trackingCode",
          "mustChangePassword",
          "permissions",
          "sessionId",
          "csrfToken",
          "recentAuthentication",
          "bankDetails"
        ],
        "properties": {
          "id": {
            "type": "string"
          },
          "name": {
            "type": "string"
          },
          "email": {
            "type": "string"
          },
          "role": {
            "type": "string",
            "enum": [
              "customer",
              "staff",
              "admin"
            ]
          },
          "blocked": {
            "type": "boolean"
          },
          "trackingCode": {
            "type": "string"
          },
          "mustChangePassword": {
            "type": "boolean"
          },
          "permissions": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "sessionId": {
            "type": "string"
          },
          "csrfToken": {
            "type": "string"
          },
          "recentAuthentication": {
            "type": "boolean"
          },
          "bankDetails": {
            "allOf": [
              {
                "$ref": "#/components/schemas/BankDetails"
              }
            ],
            "nullable": true,
            "description": "Private encrypted payout profile; visible only to the signed-in owner. Null until configured."
          }
        }
      },
      "Error": {
        "type": "object",
        "required": [
          "error",
          "requestId"
        ],
        "properties": {
          "error": {
            "type": "object",
