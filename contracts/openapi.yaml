{
  "openapi": "3.0.3",
  "info": {
    "title": "Hoàn Xu API",
    "version": "1.0.0",
    "description": "Windows local PostgreSQL API. Google-only customer identities; provisioned internal accounts. No public registration. Financial commands are transactional and idempotent. Money amounts are integer VND, dates UTC except check-ins in Asia/Ho_Chi_Minh. Recent password authentication is required for money, account resets and policy changes. Unsupported affiliate integrations remain demo/unavailable."
  },
  "servers": [
    {
      "url": "http://localhost:3000/api/v1"
    }
  ],
