services:
  - type: web
    name: hoan-xu-backend
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # Private uploads still require this disk. Chrome's profile lives on EC2.
    disk:
      name: hoan-xu-private-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: APP_ORIGIN
        value: https://hoan-xu.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: REMOTE_BROWSER_ENABLED
        value: "true"
      - key: REMOTE_BROWSER_UPSTREAM
        value: http://127.0.0.1:6080
      - key: CHROME_SSH_TUNNEL_ENABLED
        value: "true"
      - key: CHROME_SSH_HOST
        sync: false
      - key: CHROME_SSH_USER
        value: chrome-tunnel
      - key: CHROME_SSH_PORT
        value: "22"
      - key: CHROME_SSH_PRIVATE_KEY
        sync: false
      - key: CHROME_SSH_KNOWN_HOSTS
        sync: false
      - key: REMOTE_BROWSER_BRIDGE_PASSWORD
        sync: false
      - key: REMOTE_BROWSER_ORIGIN
        value: https://hoan-xu-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://hoan-xu.vercel.app/api/v1/auth/google/callback
