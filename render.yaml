services:
  - type: web
    name: hoan-xu-backend
    runtime: docker
    region: singapore
    plan: 1c-2g
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    # Cookies persist in PostgreSQL. This disk also preserves profile/uploads.
    # For a new service, omit this block if only cookies need to persist.
    disk:
      name: hoan-xu-private-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: APP_ORIGIN
        value: https://hoan-xu.vercel.app
      - key: COOKIE_SECURE
        value: "true"
      - key: REMOTE_BROWSER_ENABLED
        value: "true"
      - key: REMOTE_BROWSER_ORIGIN
        value: https://hoan-xu-backend.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://hoan-xu.vercel.app/api/v1/auth/google/callback
      - key: SHOPEE_ENABLED
        value: "false"
      - key: SHOPEE_TRACKING_VERIFIED
        value: "false"
      - key: SHOPEE_PUBLISHER
        sync: false
      - key: SHOPEE_SCHEMA_VERIFIED
        value: "true"
      - key: SHOPEE_PRICE_SCALE
        value: "100000"
