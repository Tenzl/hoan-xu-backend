name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run ./tests/run.go
      - run: go run ./tests/run.go vet
      - run: go build ./cmd/api ./cmd/admin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-vm-modules --test tests/unit/remotebrowser/viewer.test.cjs
