name: Database and browser integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hoanxu
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: hoanxu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hoanxu -d hoanxu_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://hoanxu:integration-only@127.0.0.1:5432/hoanxu_test?sslmode=disable
      REQUIRE_DB_TESTS: '1'
      REQUIRE_BROWSER_FIXTURES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes playwright@1.56.0 install --with-deps chromium
      - name: Locate fixture Chromium
        run: |
          browser=$(find "$HOME/.cache/ms-playwright" -type f -name chrome -print -quit)
          test -n "$browser"
          echo "BROWSER_TEST_PATH=$browser" >> "$GITHUB_ENV"
      - name: Run database and browser fixtures
        run: xvfb-run -a go run ./tests/run.go test -race
      - run: node scripts/validate-contract.mjs
      - run: go run ./tests/run.go vet
      - run: go build ./cmd/api ./cmd/admin
