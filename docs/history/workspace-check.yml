name: Local application checks
on: [push, pull_request]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go test ./...
        working-directory: backend
      - run: go vet ./...
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run generate:i18n
        working-directory: frontend
      - run: git diff --exit-code -- backend/internal/api/en.json frontend/public/demo/hoan-xu-en.html frontend/src/lib/demo-hashes.ts
      - run: npm run build
        working-directory: frontend
      - run: npm run generate
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/lib/api-schema.d.ts
